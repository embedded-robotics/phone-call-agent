<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone Call Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 32px;
    }

    h1 { font-size: 1.4rem; font-weight: 500; color: #aaa; letter-spacing: 0.05em; }

    #btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #333;
      background: #1a1a1a;
      color: #e0e0e0;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
    }
    #btn:hover { border-color: #555; background: #222; }
    #btn.active {
      border-color: #4caf50;
      background: #1b2e1b;
      box-shadow: 0 0 24px rgba(76,175,80,0.3);
    }
    #btn.speaking {
      border-color: #2196f3;
      background: #0d1f2d;
      box-shadow: 0 0 24px rgba(33,150,243,0.3);
    }
    #btn.connecting {
      border-color: #ff9800;
      background: #2a1e0d;
    }

    #status {
      font-size: 0.85rem;
      color: #666;
      height: 1.2em;
      transition: color 0.2s;
    }

    #transcript {
      width: min(520px, 90vw);
      max-height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.5;
      max-width: 85%;
    }
    .msg.user {
      background: #1e2a1e;
      border: 1px solid #2a3d2a;
      align-self: flex-end;
      color: #90c990;
    }
    .msg.agent {
      background: #1a1f2e;
      border: 1px solid #252d42;
      align-self: flex-start;
      color: #90afd4;
    }
    .msg .label {
      font-size: 0.7rem;
      opacity: 0.5;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #metrics {
      width: min(520px, 90vw);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .metric-card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .metric-card .metric-label {
      font-size: 0.7rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .metric-card .metric-value {
      font-size: 1.3rem;
      font-weight: 600;
      color: #c0c0c0;
      font-variant-numeric: tabular-nums;
    }
    .metric-card .metric-value span {
      font-size: 0.75rem;
      font-weight: 400;
      color: #555;
    }
    .metric-card .metric-last {
      font-size: 0.72rem;
      color: #444;
    }
  </style>
</head>
<body>

<h1>Phone Call Agent</h1>

<button id="btn">START</button>

<div id="status">Click to begin</div>

<div id="metrics">
  <div class="metric-card">
    <div class="metric-label">STT handoff</div>
    <div class="metric-value" id="stt-avg">—<span> ms</span></div>
    <div class="metric-last" id="stt-last"></div>
  </div>
  <div class="metric-card">
    <div class="metric-label">LLM first token</div>
    <div class="metric-value" id="llm-avg">—<span> ms</span></div>
    <div class="metric-last" id="llm-last"></div>
  </div>
  <div class="metric-card">
    <div class="metric-label">TTS first audio</div>
    <div class="metric-value" id="tts-avg">—<span> ms</span></div>
    <div class="metric-last" id="tts-last"></div>
  </div>
</div>

<div id="transcript"></div>

<script>
// ─── Playback tracking ────────────────────────────────────────────────────────
let pendingBlobs = 0;

function onBlobFinished() {
  pendingBlobs--;
  if (pendingBlobs === 0 && ws && ws.readyState === WebSocket.OPEN) {
    ws.send("playback_done");
  }
}

// ─── Latency metrics ──────────────────────────────────────────────────────────
const WINDOW = 5;  // rolling average over last N turns
const history = { stt: [], llm: [], tts: [] };

function updateMetrics({ stt_ms, llm_ms, tts_ms }) {
  const push = (arr, val) => { arr.push(val); if (arr.length > WINDOW) arr.shift(); };
  push(history.stt, stt_ms);
  push(history.llm, llm_ms);
  push(history.tts, tts_ms);

  const avg = arr => Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);

  const render = (avgEl, lastEl, arr) => {
    const a = avg(arr);
    avgEl.childNodes[0].textContent = a;
    lastEl.textContent = `last: ${arr[arr.length - 1]} ms`;
  };

  render(document.getElementById("stt-avg"), document.getElementById("stt-last"), history.stt);
  render(document.getElementById("llm-avg"), document.getElementById("llm-last"), history.llm);
  render(document.getElementById("tts-avg"), document.getElementById("tts-last"), history.tts);
}

// ─── State ────────────────────────────────────────────────────────────────────
let ws = null;
let audioCtx = null;
let mediaStream = null;
let scriptProcessor = null;
let agentSpeaking = false;
let playbackQueue = Promise.resolve();
let currentSource = null;   // currently playing AudioBufferSource
let cleared = false;        // drop blobs that arrive just before a clear

const btn = document.getElementById("btn");
const statusEl = document.getElementById("status");
const transcriptEl = document.getElementById("transcript");

// ─── μ-law decode table (ITU-T G.711) ────────────────────────────────────────
const ULAW_TABLE = (() => {
  const t = new Int16Array(256);
  for (let i = 0; i < 256; i++) {
    let u = ~i & 0xff;
    const sign = u & 0x80;
    const exp  = (u >> 4) & 0x07;
    const mant = u & 0x0f;
    let val = ((mant << 1) + 33) << (exp + 2);
    t[i] = sign ? 132 - val : val - 132;
  }
  return t;
})();

function mulawToFloat32(mulaw) {
  const out = new Float32Array(mulaw.length);
  for (let i = 0; i < mulaw.length; i++) {
    out[i] = ULAW_TABLE[mulaw[i]] / 32768.0;
  }
  return out;
}

// ─── UI helpers ───────────────────────────────────────────────────────────────
function setStatus(text, cls = "") {
  statusEl.textContent = text;
  btn.className = cls;
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="label">${role === "user" ? "You" : "Agent"}</div>${text}`;
  transcriptEl.appendChild(div);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

// ─── Audio playback ───────────────────────────────────────────────────────────
function schedulePlayback(mulaw) {
  if (cleared) return;  // drop blobs that arrived just before or with a clear
  pendingBlobs++;
  playbackQueue = playbackQueue.then(() => playBlob(mulaw)).then(onBlobFinished);
}

function stopCurrentSource() {
  if (currentSource) {
    try { currentSource.stop(); } catch (_) {}
    currentSource = null;
  }
}

function playBlob(mulaw) {
  return new Promise(resolve => {
    if (!audioCtx || cleared) { resolve(); return; }

    const samples = mulawToFloat32(mulaw);
    const buffer  = audioCtx.createBuffer(1, samples.length, 8000);
    buffer.getChannelData(0).set(samples);

    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    src.connect(audioCtx.destination);
    src.onended = () => { currentSource = null; resolve(); };
    currentSource = src;
    src.start();

    agentSpeaking = true;
    setStatus("Agent speaking…", "speaking");
  }).then(() => {
    if (cleared) return;  // skip tail silence if we were cleared
    return new Promise(r => setTimeout(r, 200));
  }).then(() => {
    if (!cleared) {
      agentSpeaking = false;
      if (ws && ws.readyState === WebSocket.OPEN) {
        setStatus("Listening…", "active");
      }
    }
  });
}

// ─── Mic capture ──────────────────────────────────────────────────────────────
function startMic() {
  // ScriptProcessor captures PCM at the AudioContext sample rate (usually 44100
  // or 48000). We need 16000 Hz for Deepgram, so we downsample manually.
  // Simple approach: capture at 16000 Hz by creating AudioContext at that rate.
  audioCtx = new AudioContext({ sampleRate: 16000 });

  const source = audioCtx.createMediaStreamSource(mediaStream);

  // 1024-sample buffer ≈ 64 ms @ 16 kHz — low latency for fast interruption
  scriptProcessor = audioCtx.createScriptProcessor(1024, 1, 1);

  scriptProcessor.onaudioprocess = (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;

    const float32 = e.inputBuffer.getChannelData(0);
    // Convert Float32 → Int16 PCM
    const pcm16 = new Int16Array(float32.length);
    for (let i = 0; i < float32.length; i++) {
      const s = Math.max(-1, Math.min(1, float32[i]));
      pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    ws.send(pcm16.buffer);
  };

  source.connect(scriptProcessor);
  scriptProcessor.connect(audioCtx.destination); // required to fire onaudioprocess
}

function stopMic() {
  if (scriptProcessor) { scriptProcessor.disconnect(); scriptProcessor = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
}

// ─── WebSocket ────────────────────────────────────────────────────────────────
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    setStatus("Connected — speak now", "active");
    startMic();
  };

  ws.onmessage = (e) => {
    if (typeof e.data === "string") {
      if (e.data === "clear") {
        cleared = true;
        pendingBlobs = 0;
        stopCurrentSource();         // stop any currently playing audio immediately
        playbackQueue = Promise.resolve();
        agentSpeaking = false;
        setStatus("Listening…", "active");
        // Allow new blobs from the next response to queue normally
        setTimeout(() => { cleared = false; }, 300);
      } else {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === "metrics") updateMetrics(msg);
        } catch (_) {}
      }
      return;
    }
    // Binary: μ-law audio blob
    schedulePlayback(new Uint8Array(e.data));
  };

  ws.onclose = () => {
    stopMic();
    agentSpeaking = false;
    setStatus("Disconnected — click to reconnect");
    btn.className = "";
    btn.textContent = "START";
  };

  ws.onerror = () => {
    setStatus("Connection error");
  };
}

function disconnect() {
  if (ws) { ws.close(); ws = null; }
  stopMic();
  agentSpeaking = false;
  playbackQueue = Promise.resolve();
}

// ─── Button ───────────────────────────────────────────────────────────────────
btn.addEventListener("click", async () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    disconnect();
    btn.textContent = "START";
    setStatus("Click to begin");
    return;
  }

  setStatus("Requesting microphone…", "connecting");
  btn.textContent = "…";

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
        sampleRate: 16000,
        channelCount: 1,
      }
    });
  } catch (err) {
    setStatus("Microphone access denied");
    btn.textContent = "START";
    btn.className = "";
    return;
  }

  btn.textContent = "END";
  setStatus("Connecting…", "connecting");
  connect();
});
</script>
</body>
</html>
